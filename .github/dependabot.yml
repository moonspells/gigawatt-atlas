# Dependabot version updates (10 §8.5). Security updates ignore `cooldown`, but not uv's 24-hour
# release-age delay (`[tool.uv] exclude-newer = "24 hours"` in pyproject.toml): a fix published today
# resolves only after a day, so re-run the PR's checks once it is 24 hours old.
# Review the uv.lock diff of every PR: new transitive packages, sdist-only packages, and git or URL
# sources are reasons to stop.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday, time: '05:13', timezone: Etc/UTC }
    # 7 days, as zizmor's dependabot-cooldown audit asks (it fails the required `zizmor` check below 7).
    # boto3 releases almost daily, so the cooldown also keeps that noise down.
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
        update-types: ['minor', 'patch']
      minor-patch:
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: '05:13', timezone: Etc/UTC }
    # Dependabot bumps the action SHAs, not the setup-uv `version:` input; uv itself is bumped by hand
    # together with `[tool.uv] required-version`.
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ['*'] }
