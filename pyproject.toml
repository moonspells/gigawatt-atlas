[project]
name = "gigawatt-atlas"
version = "0.1.0"
description = "Gigawatt Atlas: an open dataset and pipeline of US data center campuses and projects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic~=2.13.5",
  "httpx~=0.28.1",
  "duckdb~=1.5.6",
  "jsonschema~=4.26.0",
  "boto3~=1.43.108",
]

[project.scripts]
atlas = "atlas.cli:main"

[dependency-groups]
dev = ["ruff~=0.16.10", "mypy~=2.4.0", "pytest~=9.1.1", "types-jsonschema~=4.26.0"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.32,<0.12"
exclude-newer = "24 hours"      # release-age delay (10 §11.8); uv.lock records exclude-newer-span = "PT24H"

[tool.uv.build-backend]
module-name = "atlas"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["fixtures/release"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "N", "C4", "PIE", "RET", "TID"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["atlas", "tests"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "network: talks to a live source; runs only with ATLAS_NETWORK_TESTS=1",
  "tippecanoe: needs tippecanoe on PATH",
]
